# Weekly spec health report: drift between spec and code, and inconsistencies
# inside the spec. Needs only Python 3: no Claude Code, no API key.
# Include in .gitlab-ci.yml, then create a pipeline schedule
# (Build > Pipeline schedules) with the variable SPEC_HEALTH=1.
# The job never fails because of findings: they are a report, not a gate.
spec-health:
  image: python:3.12-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SPEC_HEALTH == "1"
  before_script:
    - apt-get update -qq && apt-get install -y -qq git > /dev/null
    - git clone --depth 1 --branch livespec--v0.8.3 https://github.com/livespecdev/livespec-skills.git /tmp/livespec-skills
  script:
    - python3 /tmp/livespec-skills/scripts/check_spec.py | tee spec-health.txt
    - python3 /tmp/livespec-skills/scripts/check_drift.py | tee -a spec-health.txt
  artifacts:
    paths: [spec-health.txt]
    expire_in: 30 days
